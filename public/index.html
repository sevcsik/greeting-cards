<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interaktív üdvözlőkártya hanglejátszó">
  <title>Üdvözlőkártya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="background" aria-hidden="true"></div>
  <div class="overlay" aria-hidden="true"></div>

  <main class="app">
    <header class="app__header">
      <p class="app__eyebrow">Greeting Cards</p>
      <h1 class="app__title">Üdvözlő hangüzenetek</h1>
      <p class="app__subtitle">Válassz egy sávot, vagy olvasd be a QR-kódot a közvetlen indításhoz.</p>
    </header>

    <section class="player" aria-label="Hanglejátszó">
      <div class="player__now-playing">
        <span class="player__label">Most szól</span>
        <h2 class="player__track-title" id="track-title">—</h2>
      </div>

      <div class="player__controls">
        <button class="player__btn player__btn--primary" id="play-pause-btn" type="button" aria-label="Lejátszás">
          <svg class="icon icon--play" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5v14l11-7z" fill="currentColor"/>
          </svg>
          <svg class="icon icon--pause hidden" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" fill="currentColor"/>
          </svg>
        </button>

        <div class="player__progress-wrap">
          <div class="player__time">
            <span id="current-time">0:00</span>
            <span id="duration">0:00</span>
          </div>
          <input
            class="player__progress"
            id="progress-bar"
            type="range"
            min="0"
            max="100"
            value="0"
            step="0.1"
            aria-label="Lejátszási pozíció"
          >
        </div>
      </div>

      <ul class="track-list" id="track-list" role="listbox" aria-label="Sávlista"></ul>
    </section>
  </main>

  <audio id="audio" preload="metadata"></audio>

  <script type="module" src="js/main.js"></script>
</body>
</html>
