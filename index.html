<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Interaktív üdvözlőkártya hanglejátszó">
  <meta name="theme-color" content="#1a120e">
  <title>Üdvözlőkártya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="player-screen" aria-label="Hanglejátszó">
    <div class="player-screen__cover" aria-hidden="true"></div>
    <div class="player-screen__shade" aria-hidden="true"></div>

    <div class="player-screen__controls">
      <div class="player-screen__meta">
        <p class="player-screen__label">Most szól</p>
        <h1 class="player-screen__title" id="track-title">—</h1>
      </div>

      <div class="player-screen__progress">
        <div class="player-screen__time">
          <span id="current-time">0:00</span>
          <span id="duration">0:00</span>
        </div>
        <input
          class="player-screen__seek"
          id="progress-bar"
          type="range"
          min="0"
          max="100"
          value="0"
          step="0.1"
          aria-label="Lejátszási pozíció"
        >
      </div>

      <div class="player-screen__transport">
        <button class="player-screen__btn" id="prev-btn" type="button" aria-label="Előző sáv">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6h2v12H6V6zm3.5 6 8.5 6V6l-8.5 6z" fill="currentColor"/>
          </svg>
        </button>

        <button class="player-screen__btn player-screen__btn--primary" id="play-pause-btn" type="button" aria-label="Lejátszás">
          <svg class="icon icon--play" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5v14l11-7z" fill="currentColor"/>
          </svg>
          <svg class="icon icon--pause hidden" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" fill="currentColor"/>
          </svg>
        </button>

        <button class="player-screen__btn" id="next-btn" type="button" aria-label="Következő sáv">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M16 18h2V6h-2v12zm-11-7 8.5-6v12L5 11z" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <audio id="audio" preload="metadata"></audio>

  <script type="module" src="js/main.js"></script>
</body>
</html>
